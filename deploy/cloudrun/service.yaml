# Servicio de Cloud Run para el backend. deploy.sh sustituye las variables ${...} con envsubst.
# Requisitos (una vez por proyecto): ver deploy/README.md.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: benchify-api
  labels:
    app: benchify
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "4"
        # Arranque de la JVM más rápido en instancias recién creadas
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: benchify-api@${PROJECT_ID}.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: ${IMAGE}
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            # Conector de Cloud SQL: TLS autorizado por IAM, sin IP pública en la lista blanca
            - name: DB_URL
              value: jdbc:postgresql:///benchify?cloudSqlInstance=${CLOUD_SQL_INSTANCE}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
            - name: DB_USERNAME
              value: benchify
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: benchify-db-password
                  key: latest
            - name: FIREBASE_PROJECT_ID
              value: ${PROJECT_ID}
            - name: FIREBASE_STORAGE_BUCKET
              value: ${STORAGE_BUCKET}
            - name: CORS_ALLOWED_ORIGINS
              value: ${CORS_ALLOWED_ORIGINS}
            - name: API_DOCS_ENABLED
              value: "false"
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 30
