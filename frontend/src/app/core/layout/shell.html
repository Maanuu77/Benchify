<a class="skip-link" href="#contenido">Saltar al contenido</a>

<mat-sidenav-container class="container">
  <mat-sidenav
    #drawer
    class="drawer"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="false"
    [attr.role]="isHandset() ? 'dialog' : 'navigation'"
    aria-label="Menú principal"
  >
    <mat-nav-list>
      @for (link of links; track link.path) {
        <a mat-list-item [routerLink]="link.path" routerLinkActive #rla="routerLinkActive"
           [activated]="rla.isActive" (click)="drawer.close()">
          <mat-icon matListItemIcon aria-hidden="true">{{ link.icon }}</mat-icon>
          <span matListItemTitle>{{ link.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <mat-toolbar class="toolbar" role="banner">
      @if (isHandset()) {
        <button mat-icon-button type="button" aria-label="Abrir menú" (click)="drawer.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <a class="brand" routerLink="/mapa" aria-label="Benchify, ir al mapa">
        <mat-icon aria-hidden="true">park</mat-icon>
        <span>Benchify</span>
      </a>
      <span class="spacer"></span>
      @if (!isHandset()) {
        <nav class="links" aria-label="Principal">
          @for (link of links; track link.path) {
            <a mat-button [routerLink]="link.path" routerLinkActive="active" ariaCurrentWhenActive="page">
              <mat-icon aria-hidden="true">{{ link.icon }}</mat-icon>
              {{ link.label }}
            </a>
          }
        </nav>
      }
      <ng-content select="[bfToolbarEnd]" />
    </mat-toolbar>

    <main id="contenido" class="main" tabindex="-1">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
