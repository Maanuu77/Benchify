version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    target-branch: develop
    groups:
      spring:
        patterns: ["org.springframework*", "org.springdoc*"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    target-branch: develop
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop

  - package-ecosystem: docker
    directories: ["/backend", "/docker/firebase-emulators"]
    schedule:
      interval: monthly
    target-branch: develop
