spring.application.name=benchify

# ── Servidor ──────────────────────────────────────────────────────────────────
server.port=8080

# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  MODO LOCAL: H2 en memoria (sin instalación, datos se borran al parar)   ║
# ║                                                                          ║
# ║  Para PostgreSQL: comenta el bloque H2 y descomenta el bloque PG abajo.  ║
# ╚══════════════════════════════════════════════════════════════════════════╝

# ── H2 (modo PostgreSQL para compatibilidad de SQL) ───────────────────────────
spring.datasource.url=jdbc:h2:mem:benchify;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── PostgreSQL (para producción — DESCOMENTAR y comentar H2 arriba) ───────────
#spring.datasource.url=jdbc:postgresql://localhost:5432/benchify
#spring.datasource.username=benchify_user
#spring.datasource.password=benchify_pass
#spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Ejecuta data.sql DESPUÉS de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ── Subida de archivos ────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=benchify-secret-key-change-this-in-production-must-be-at-least-256-bits-long-enough
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.benchify=DEBUG
