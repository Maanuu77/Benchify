<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Mapa', 'Explora todos los bancos de España en un mapa interactivo.')}">
</head>
<body>
<header th:replace="~{fragments/header :: header('mapa')}"></header>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""/>
<link rel="stylesheet" th:href="@{/css/map.css}">

<main class="map-page">

    <!-- Filtros (toolbar superior) -->
    <div class="map-toolbar" role="toolbar" aria-label="Filtros del mapa">
        <button class="filter-chip" data-filter="con-sombra" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 13V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6"/>
                <path d="M3 13h18"/><path d="M7 17h.01"/><path d="M11 17h.01"/><path d="M15 17h.01"/>
            </svg>
            Con sombra
        </button>
        <button class="filter-chip" data-filter="accesible" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="4" r="2"/><path d="M19 13v-2a7 7 0 0 0-14 0v2"/>
                <path d="M12 9v8"/><path d="M8 21h8"/>
            </svg>
            Accesible
        </button>
        <button class="filter-chip" data-filter="con-respaldo" type="button">Con respaldo</button>
        <button class="filter-chip" data-filter="puntuacion-4" type="button">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
            4+ estrellas
        </button>

        <div style="flex:1;"></div>

        <span id="map-count" class="text-xs text-muted" style="flex-shrink:0;">Cargando bancos...</span>
    </div>

    <!-- Mapa principal -->
    <div style="position:relative;flex:1;">
        <div id="map" role="application" aria-label="Mapa interactivo de bancos"></div>

        <button id="locate-btn" class="locate-btn" type="button" aria-label="Ir a mi ubicación">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="2" x2="12" y2="6"/>
                <line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/>
                <line x1="18" y1="12" x2="22" y2="12"/><circle cx="12" cy="12" r="3" fill="currentColor"/>
            </svg>
        </button>
    </div>
</main>

<!-- Leaflet JS + mapa de la aplicación -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
<script th:src="@{/js/map.js}" defer></script>
</body>
</html>
