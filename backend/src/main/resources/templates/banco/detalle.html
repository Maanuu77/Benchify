<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(${banco.titulo}, ${banco.descripcion})}"></head>
<body>
<header th:replace="~{fragments/header :: header('')}"></header>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<link rel="stylesheet" th:href="@{/css/map.css}">

<!-- Schema.org JSON-LD para SEO -->
<script type="application/ld+json" th:inline="javascript">
{
    "@context": "https://schema.org",
    "@type": "TouristAttraction",
    "name": /*[[${banco.titulo}]]*/ "",
    "description": /*[[${banco.descripcion}]]*/ "",
    "geo": {
        "@type": "GeoCoordinates",
        "latitude": /*[[${banco.lat}]]*/ 0,
        "longitude": /*[[${banco.lng}]]*/ 0
    },
    "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": /*[[${banco.puntuacionMedia}]]*/ 0,
        "reviewCount": /*[[${banco.numResenas}]]*/ 0,
        "bestRating": 5,
        "worstRating": 1
    }
}
</script>

<main class="page">
    <div class="container" style="max-width: 920px; padding-top: var(--space-8); padding-bottom: var(--space-12);">

        <!-- Hero / imagen principal -->
        <div class="banco-hero">
            <th:block th:if="${banco.imagenesUrls != null and !banco.imagenesUrls.isEmpty()}">
                <img th:src="${banco.imagenesUrls[0]}" th:alt="${banco.titulo}">
            </th:block>
            <div th:if="${banco.imagenesUrls == null or banco.imagenesUrls.isEmpty()}"
                 class="banco-hero-placeholder">
                <svg width="96" height="96" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M4 11h16v2H4zm-1 4v4h2v-2h14v2h2v-4zM7 4v6h2V6h6v4h2V4z"/>
                </svg>
            </div>
        </div>

        <!-- Cabecera: título + acciones -->
        <div class="flex justify-between items-center" style="flex-wrap:wrap; gap: var(--space-3);">
            <div style="flex: 1; min-width: 240px;">
                <h1 style="margin-bottom: var(--space-2);" th:text="${banco.titulo}">Título</h1>
                <p class="text-muted" style="margin: 0;">
                    <th:block th:if="${banco.ciudad != null}">
                        <th:block th:text="${banco.ciudad}">Ciudad</th:block>
                        <span th:if="${banco.provincia != null}">, <span th:text="${banco.provincia}">Provincia</span></span>
                    </th:block>
                </p>
            </div>

            <div class="flex gap-2" style="flex-wrap:wrap;">
                <a th:href="@{'https://www.google.com/maps/dir/?api=1&destination=' + ${banco.lat} + ',' + ${banco.lng} + '&travelmode=walking'}"
                   target="_blank" rel="noopener" class="btn btn-primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>
                    </svg>
                    Cómo llegar
                </a>

                <button sec:authorize="isAuthenticated()" type="button" class="btn btn-secondary"
                        th:hx-post="@{'/api/bancos/' + ${banco.id} + '/favorito'}" hx-swap="none"
                        th:attr="aria-pressed=${esFavorito}">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                    </svg>
                    <span th:text="${esFavorito} ? 'En favoritos' : 'Añadir a favoritos'">Favorito</span>
                </button>

                <button sec:authorize="isAuthenticated()" type="button" class="btn btn-secondary"
                        th:hx-post="@{'/api/bancos/' + ${banco.id} + '/checkin'}" hx-swap="none">
                    Estuve aquí
                </button>
            </div>
        </div>

        <!-- Rating -->
        <div class="flex items-center gap-3 mt-4">
            <span class="stars" th:attr="data-stars=${banco.puntuacionMedia}" style="font-size:var(--font-size-lg);"
                  aria-label="Puntuación"></span>
            <span class="text-muted">
                <strong style="color: var(--color-text);"
                        th:text="${#numbers.formatDecimal(banco.puntuacionMedia, 1, 1)}">0.0</strong>
                ·
                <span th:text="${banco.numResenas}">0</span> reseñas
            </span>
        </div>

        <!-- Etiquetas -->
        <div class="tag-list mt-4" th:if="${banco.etiquetas != null and !banco.etiquetas.isEmpty()}">
            <span class="tag" th:each="et : ${banco.etiquetas}" th:text="${et}">etiqueta</span>
        </div>

        <!-- Características -->
        <div class="banco-features">
            <span th:if="${banco.conSombra}" class="banco-feature">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 2v6"/><path d="M12 22v-3"/><path d="M4.93 4.93l4.24 4.24"/>
                    <path d="M14.83 14.83l4.24 4.24"/><circle cx="12" cy="12" r="4"/>
                </svg>
                Con sombra
            </span>
            <span th:if="${banco.accesible}" class="banco-feature">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="4" r="2"/><path d="M19 13v-2a7 7 0 0 0-14 0v2"/>
                </svg>
                Accesible
            </span>
            <span th:if="${banco.conRespaldo}" class="banco-feature">Con respaldo</span>
            <span th:if="${banco.material != null}" class="banco-feature"
                  th:text="'Material: ' + ${#strings.toLowerCase(banco.material)}">Material</span>
        </div>

        <!-- Descripción -->
        <div class="mt-6" th:if="${banco.descripcion != null and !banco.descripcion.isEmpty()}">
            <p style="font-size: var(--font-size-lg); line-height: 1.7;" th:text="${banco.descripcion}">Descripción</p>
        </div>

        <!-- Mini-mapa -->
        <div class="mt-6">
            <div id="mini-map" class="mini-map" role="region" aria-label="Ubicación del banco"
                 th:attr="data-lat=${banco.lat}, data-lng=${banco.lng}"></div>
        </div>

        <!-- Reseñas -->
        <section class="mt-8">
            <h2>Reseñas <span class="text-muted" style="font-size:var(--font-size-base);font-weight:400;"
                              th:text="'(' + ${banco.numResenas} + ')'">(0)</span></h2>

            <!-- Formulario para escribir reseña -->
            <div sec:authorize="isAuthenticated()" class="card card-body mt-4">
                <h3 style="font-size:var(--font-size-lg);">Escribe tu reseña</h3>
                <form id="form-resena" th:hx-post="@{'/api/bancos/' + ${banco.id} + '/resenas'}"
                      hx-ext="json-enc" hx-swap="none">
                    <div class="form-group">
                        <label class="form-label">Puntuación</label>
                        <div class="stars-input">
                            <input id="star5" type="radio" name="puntuacion" value="5"><label for="star5"><svg viewBox="0 0 20 20"><path d="M9.05 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.957a1 1 0 00.95.69h4.16c.969 0 1.371 1.24.588 1.81l-3.366 2.446a1 1 0 00-.364 1.118l1.287 3.957c.3.921-.755 1.688-1.54 1.118l-3.366-2.446a1 1 0 00-1.175 0l-3.366 2.446c-.784.57-1.838-.197-1.539-1.118l1.287-3.957a1 1 0 00-.364-1.118L2.05 9.384c-.783-.57-.38-1.81.588-1.81h4.16a1 1 0 00.95-.69l1.286-3.957z"/></svg></label>
                            <input id="star4" type="radio" name="puntuacion" value="4"><label for="star4"><svg viewBox="0 0 20 20"><path d="M9.05 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.957a1 1 0 00.95.69h4.16c.969 0 1.371 1.24.588 1.81l-3.366 2.446a1 1 0 00-.364 1.118l1.287 3.957c.3.921-.755 1.688-1.54 1.118l-3.366-2.446a1 1 0 00-1.175 0l-3.366 2.446c-.784.57-1.838-.197-1.539-1.118l1.287-3.957a1 1 0 00-.364-1.118L2.05 9.384c-.783-.57-.38-1.81.588-1.81h4.16a1 1 0 00.95-.69l1.286-3.957z"/></svg></label>
                            <input id="star3" type="radio" name="puntuacion" value="3"><label for="star3"><svg viewBox="0 0 20 20"><path d="M9.05 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.957a1 1 0 00.95.69h4.16c.969 0 1.371 1.24.588 1.81l-3.366 2.446a1 1 0 00-.364 1.118l1.287 3.957c.3.921-.755 1.688-1.54 1.118l-3.366-2.446a1 1 0 00-1.175 0l-3.366 2.446c-.784.57-1.838-.197-1.539-1.118l1.287-3.957a1 1 0 00-.364-1.118L2.05 9.384c-.783-.57-.38-1.81.588-1.81h4.16a1 1 0 00.95-.69l1.286-3.957z"/></svg></label>
                            <input id="star2" type="radio" name="puntuacion" value="2"><label for="star2"><svg viewBox="0 0 20 20"><path d="M9.05 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.957a1 1 0 00.95.69h4.16c.969 0 1.371 1.24.588 1.81l-3.366 2.446a1 1 0 00-.364 1.118l1.287 3.957c.3.921-.755 1.688-1.54 1.118l-3.366-2.446a1 1 0 00-1.175 0l-3.366 2.446c-.784.57-1.838-.197-1.539-1.118l1.287-3.957a1 1 0 00-.364-1.118L2.05 9.384c-.783-.57-.38-1.81.588-1.81h4.16a1 1 0 00.95-.69l1.286-3.957z"/></svg></label>
                            <input id="star1" type="radio" name="puntuacion" value="1"><label for="star1"><svg viewBox="0 0 20 20"><path d="M9.05 2.927c.3-.921 1.603-.921 1.902 0l1.286 3.957a1 1 0 00.95.69h4.16c.969 0 1.371 1.24.588 1.81l-3.366 2.446a1 1 0 00-.364 1.118l1.287 3.957c.3.921-.755 1.688-1.54 1.118l-3.366-2.446a1 1 0 00-1.175 0l-3.366 2.446c-.784.57-1.838-.197-1.539-1.118l1.287-3.957a1 1 0 00-.364-1.118L2.05 9.384c-.783-.57-.38-1.81.588-1.81h4.16a1 1 0 00.95-.69l1.286-3.957z"/></svg></label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="comentario" class="form-label">Comentario (opcional)</label>
                        <textarea id="comentario" name="comentario" class="form-textarea"
                                  placeholder="¿Qué te ha gustado de este banco?" maxlength="1000"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">Publicar reseña</button>
                </form>
            </div>

            <p sec:authorize="isAnonymous()" class="text-muted mt-4">
                <a th:href="@{/auth/login}">Accede</a> para escribir una reseña.
            </p>

            <!-- Lista de reseñas -->
            <div class="mt-6" th:if="${!resenas.isEmpty()}">
                <div class="resena-item" th:each="resena : ${resenas}">
                    <div class="resena-header">
                        <span class="resena-author" th:text="${resena.nombreUsuario}">Usuario</span>
                        <span class="resena-date"
                              th:text="${#temporals.format(resena.fechaResena, 'd MMM yyyy')}">Fecha</span>
                    </div>
                    <span class="stars" th:attr="data-stars=${resena.puntuacion}" aria-label="Puntuación"></span>
                    <p class="resena-text" th:if="${resena.comentario != null}" th:text="${resena.comentario}">
                        Comentario de la reseña
                    </p>
                </div>
            </div>

            <div th:if="${resenas.isEmpty()}" class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <p>Aún no hay reseñas. ¡Sé el primero!</p>
            </div>
        </section>

    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

<script th:inline="javascript">
    // Mini-mapa de la ficha
    document.addEventListener('DOMContentLoaded', () => {
        const el = document.getElementById('mini-map');
        if (!el) return;
        const lat = parseFloat(el.dataset.lat);
        const lng = parseFloat(el.dataset.lng);
        const map = L.map(el, { zoomControl: false, scrollWheelZoom: false }).setView([lat, lng], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap', maxZoom: 19
        }).addTo(map);
        L.marker([lat, lng]).addTo(map);
    });

    // Tras enviar reseña, recargar para ver el cambio
    document.body.addEventListener('htmx:afterRequest', (e) => {
        if (e.detail.elt.id === 'form-resena' && e.detail.successful) {
            window.Benchify.toast('Reseña publicada', 'success');
            setTimeout(() => location.reload(), 800);
        }
    });

    // Toast de favorito y check-in
    document.body.addEventListener('htmx:afterRequest', (e) => {
        const url = e.detail.requestConfig?.path || '';
        if (e.detail.successful && url.endsWith('/favorito')) {
            const resp = JSON.parse(e.detail.xhr.responseText || '{}');
            window.Benchify.toast(resp.favorito ? 'Añadido a favoritos' : 'Quitado de favoritos', 'success');
        }
        if (e.detail.successful && url.endsWith('/checkin')) {
            window.Benchify.toast('Check-in registrado', 'success');
        }
    });
</script>
</body>
</html>
