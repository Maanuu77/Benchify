<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Moderación de bancos', null)}"></head>
<body>
<header th:replace="~{fragments/header :: header('admin')}"></header>

<main class="page">
    <div class="container" style="padding-top: var(--space-8); padding-bottom: var(--space-12);">

        <a th:href="@{/admin}" class="text-small text-muted">← Volver al panel</a>
        <h1 class="mt-2">Bancos pendientes de revisión</h1>
        <p class="text-muted mb-8" th:text="${bancos.size()} + ' bancos en cola'">0 bancos en cola</p>

        <div th:if="${bancos.isEmpty()}" class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
            <p>No hay bancos pendientes. ¡Buen trabajo!</p>
        </div>

        <div class="stack" th:if="${!bancos.isEmpty()}">
            <article class="card card-body" th:each="banco : ${bancos}" th:id="'banco-' + ${banco.id}">
                <div class="flex justify-between" style="flex-wrap:wrap; gap: var(--space-4);">
                    <div style="flex:1; min-width:240px;">
                        <h3 style="font-size:var(--font-size-lg);" th:text="${banco.titulo}">Título</h3>
                        <p class="text-small text-muted" th:if="${banco.ciudad != null}" th:text="${banco.ciudad}">Ciudad</p>
                        <p class="text-small" th:if="${banco.descripcion != null}" th:text="${banco.descripcion}">Descripción</p>
                        <p class="text-xs text-muted">
                            Por <strong th:text="${banco.creadoPorNombre}">Usuario</strong>
                            ·
                            <span th:text="${#temporals.format(banco.fechaSubida, 'd MMM yyyy HH:mm')}">Fecha</span>
                        </p>
                    </div>
                    <div class="flex gap-2" style="align-items:flex-start;">
                        <a th:href="@{'/bancos/' + ${banco.id}}" class="btn btn-secondary btn-sm">Ver ficha</a>
                        <button class="btn btn-primary btn-sm"
                                th:hx-post="@{'/api/admin/bancos/' + ${banco.id} + '/aprobar'}"
                                th:hx-target="'#banco-' + ${banco.id}"
                                hx-swap="outerHTML">
                            Aprobar
                        </button>
                        <button class="btn btn-danger btn-sm"
                                th:hx-post="@{'/api/admin/bancos/' + ${banco.id} + '/rechazar'}"
                                th:hx-target="'#banco-' + ${banco.id}"
                                hx-swap="outerHTML">
                            Rechazar
                        </button>
                    </div>
                </div>
            </article>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
