<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title, description)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1F4E3D">

    <title th:text="${title} ? ${title} + ' · Benchify' : 'Benchify · El mapa colaborativo de los mejores bancos de España'">Benchify</title>

    <meta name="description"
          th:content="${description} ?: 'Descubre, comparte y puntúa los mejores bancos para sentarse en España. El TripAdvisor del descanso urbano.'">

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Benchify">
    <meta property="og:title" th:content="${title} ?: 'Benchify'">
    <meta property="og:description"
          th:content="${description} ?: 'Descubre los mejores bancos para sentarse en España.'">
    <meta name="twitter:card" content="summary_large_image">

    <!-- CSRF (para HTMX y JS) -->
    <meta name="_csrf" th:content="${_csrf?.token}">
    <meta name="_csrf_header" th:content="${_csrf?.headerName}">

    <!-- Tipografía -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" th:href="@{/css/main.css}">

    <!-- Favicon SVG inline (verde naturaleza) -->
    <link rel="icon" type="image/svg+xml"
          href="data:image/svg+xml,&#37;3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'&#37;3E&#37;3Cpath fill='&#37;231F4E3D' d='M4 11h16v2H4zm-1 4v4h2v-2h14v2h2v-4zM7 4v6h2V6h6v4h2V4z'/&#37;3E&#37;3C/svg&#37;3E">
</head>
</html>
