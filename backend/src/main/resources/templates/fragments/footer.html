<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<footer th:fragment="footer" class="site-footer">
    <div class="container">
        <div class="footer-row">
            <div>
                <strong style="color: var(--color-primary);">Benchify</strong>
                <span class="text-muted"> · El mapa colaborativo de los mejores bancos de España</span>
            </div>
            <div class="flex gap-4">
                <a th:href="@{/}">Inicio</a>
                <a th:href="@{/mapa}">Mapa</a>
                <a th:href="@{/legal/privacidad}">Privacidad</a>
                <a th:href="@{/legal/terminos}">Términos</a>
            </div>
        </div>
        <p class="text-xs text-muted mt-6" style="text-align:center;">
            © <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2026</span> Benchify · Hecho con cariño
        </p>
    </div>
</footer>
</body>
</html>
