spring:
  application:
    name: benchify
  profiles:
    default: dev
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    # data.sql runs after Hibernate creates the tables
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Cloud Run terminates TLS at the load balancer and forwards X-Forwarded-* headers
  forward-headers-strategy: framework

benchify:
  cors:
    allowed-origins: []

logging:
  level:
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
