spring:
  application:
    name: benchify
  profiles:
    default: dev
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks the mappings match it
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    # Never wipe a real database by accident
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: ${PORT:8080}
  shutdown: graceful
  # Cloud Run terminates TLS at the load balancer and forwards X-Forwarded-* headers
  forward-headers-strategy: framework

benchify:
  cors:
    allowed-origins: []
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:demo-benchify}
    storage-bucket: ${FIREBASE_STORAGE_BUCKET:demo-benchify.appspot.com}

logging:
  level:
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
