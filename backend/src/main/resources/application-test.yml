# Datasource is provided by AbstractIntegrationTest (Testcontainers PostGIS or IT_DATABASE_URL)
benchify:
  cors:
    allowed-origins:
      - http://localhost:4200
  firebase:
    # Tests use StubIdTokenVerifier instead of the Admin SDK
    enabled: false
  rate-limit:
    # Flows make many writes in a row; the rate limiter has its own tests
    enabled: false

logging:
  level:
    org.testcontainers: INFO
