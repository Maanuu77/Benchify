# Production (Cloud Run + Neon): every secret and endpoint comes from environment variables
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      # Neon suspends the database after a few idle minutes: keep no idle connections that would wake
      # it up, and renew open ones before Neon drops them
      minimum-idle: 1
      idle-timeout: 60000
      max-lifetime: 240000
      keepalive-time: 0

benchify:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID}
    storage-bucket: ${FIREBASE_STORAGE_BUCKET}

springdoc:
  # Public documentation is opt-in in production
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

logging:
  level:
    root: INFO
    com.benchify: INFO
