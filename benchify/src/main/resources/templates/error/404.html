<!DOCTYPE html>

<body>

<main class="page">
    <div class="container text-center" style="padding-top: var(--space-24); padding-bottom: var(--space-24);">
        <div style="font-size: 6rem; font-weight: 700; color: var(--color-primary); line-height: 1;">404</div>
        <h1 class="mt-4">Este banco no existe</h1>
        <p class="text-muted mb-8">La página que buscas no está aquí. Quizá la moviste o nunca existió.</p>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
