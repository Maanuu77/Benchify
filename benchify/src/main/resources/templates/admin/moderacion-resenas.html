<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Moderación de reseñas', null)}"></head>
<body>
<header th:replace="~{fragments/header :: header('admin')}"></header>

<main class="page">
    <div class="container" style="padding-top: var(--space-8); padding-bottom: var(--space-12);">

        <a th:href="@{/admin}" class="text-small text-muted">← Volver al panel</a>
        <h1 class="mt-2">Reseñas reportadas</h1>
        <p class="text-muted mb-8" th:text="${resenas.size()} + ' reseñas reportadas'">0 reseñas reportadas</p>

        <div th:if="${resenas.isEmpty()}" class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
            <p>No hay reseñas reportadas.</p>
        </div>

        <div class="stack" th:if="${!resenas.isEmpty()}">
            <article class="card card-body" th:each="resena : ${resenas}" th:id="'resena-' + ${resena.id}">
                <div class="flex justify-between" style="flex-wrap:wrap; gap: var(--space-4);">
                    <div style="flex:1; min-width:240px;">
                        <div class="flex items-center gap-2">
                            <strong th:text="${resena.nombreUsuario}">Usuario</strong>
                            <span class="stars" th:attr="data-stars=${resena.puntuacion}"></span>
                        </div>
                        <p class="text-small mt-2" th:if="${resena.comentario != null}" th:text="${resena.comentario}">Comentario</p>
                        <p class="text-xs text-muted">
                            <span th:text="${resena.numReportes}">0</span> reportes ·
                            <span th:text="${#temporals.format(resena.fechaResena, 'd MMM yyyy HH:mm')}">Fecha</span>
                        </p>
                    </div>
                    <div class="flex gap-2" style="align-items:flex-start;">
                        <button class="btn btn-danger btn-sm"
                                th:hx-delete="@{'/api/admin/resenas/' + ${resena.id}}"
                                th:hx-target="'#resena-' + ${resena.id}"
                                hx-swap="outerHTML"
                                hx-confirm="¿Eliminar esta reseña?">
                            Eliminar
                        </button>
                    </div>
                </div>
            </article>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
