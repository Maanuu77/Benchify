<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Acceder', null)}"></head>
<body>
<header th:replace="~{fragments/header :: header('login')}"></header>

<main class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">Bienvenido de vuelta</h1>
        <p class="auth-subtitle">Accede para subir bancos y dejar reseñas</p>

        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">Error</div>

        <form th:action="@{/auth/login}" th:object="${loginRequest}" method="post" novalidate>
            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input id="email" type="email" th:field="*{email}" class="form-input"
                       autocomplete="email" required autofocus>
                <div class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <input id="password" type="password" th:field="*{password}" class="form-input"
                       autocomplete="current-password" required>
                <div class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">Acceder</button>
        </form>

        <div class="auth-footer">
            ¿No tienes cuenta? <a th:href="@{/auth/registro}">Crea una gratis</a>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
