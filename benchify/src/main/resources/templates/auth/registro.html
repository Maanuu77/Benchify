<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Crear cuenta', null)}"></head>
<body>
<header th:replace="~{fragments/header :: header('registro')}"></header>

<main class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">Únete a Benchify</h1>
        <p class="auth-subtitle">Crea tu cuenta en segundos. Sin tarjeta, sin spam.</p>

        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">Error</div>

        <form th:action="@{/auth/registro}" th:object="${registroRequest}" method="post" novalidate>
            <div class="form-group">
                <label for="nombre" class="form-label">Nombre</label>
                <input id="nombre" type="text" th:field="*{nombre}" class="form-input"
                       autocomplete="name" required autofocus>
                <div class="form-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input id="email" type="email" th:field="*{email}" class="form-input"
                       autocomplete="email" required>
                <div class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <input id="password" type="password" th:field="*{password}" class="form-input"
                       autocomplete="new-password" minlength="8" required>
                <p class="form-help">Mínimo 8 caracteres.</p>
                <div class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">Crear cuenta</button>

            <p class="form-help mt-4" style="text-align:center;">
                Al registrarte aceptas nuestros
                <a th:href="@{/legal/terminos}">términos</a> y
                <a th:href="@{/legal/privacidad}">política de privacidad</a>.
            </p>
        </form>

        <div class="auth-footer">
            ¿Ya tienes cuenta? <a th:href="@{/auth/login}">Accede</a>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
